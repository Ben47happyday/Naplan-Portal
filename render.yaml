# Render.com Blueprint — deploys the web portal + a managed Postgres
# database in one go. Picked as a default because it's the simplest path
# to "online" for a small Flask app (free web + free Postgres tier, no
# separate account juggling) and nothing in the repo pointed at another
# provider already. Not a requirement — Railway, Fly.io, or a self-hosted
# Postgres (Neon/Supabase) + any Flask-friendly host all work too; this
# file just isn't needed for those.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render reads this file and
# provisions both services.
services:
  - type: web
    name: naplan-prep-hub
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naplan-portal-db
          property: connectionString

databases:
  - name: naplan-portal-db
    plan: free
    databaseName: naplan_portal
    user: naplan_portal
