    <rect x="45" y="48" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="59" y="48" width="10" height="8" rx="2" fill="#F7A026"/>
    <rect x="31" y="60" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="45" y="60" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="59" y="60" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="31" y="72" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="45" y="72" width="10" height="8" rx="2" fill="#EAF3DE"/>
    <rect x="59" y="72" width="10" height="8" rx="2" fill="#EAF3DE"/>
