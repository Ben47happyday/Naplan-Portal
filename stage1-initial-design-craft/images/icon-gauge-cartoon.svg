<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- flat 2D cartoon level gauge with a friendly face -->
  <circle cx="50" cy="50" r="38" fill="#3B6D11"/>
  <circle cx="50" cy="50" r="30" fill="#EAF3DE"/>

  <!-- tick marks -->
  <line x1="22" y1="50" x2="28" y2="50" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="22" x2="50" y2="28" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="72" y2="50" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="34" y2="34" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="30" x2="66" y2="34" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>

  <!-- needle pointing into the good zone -->
  <polygon points="50,50 68,32 60,26" fill="#F7A026"/>
  <circle cx="50" cy="50" r="6" fill="#4A1B0C"/>

  <!-- small face beneath the needle -->
  <circle cx="43" cy="62" r="2.4" fill="#2C2013"/>
  <circle cx="57" cy="62" r="2.4" fill="#2C2013"/>
  <path d="M43 68 Q50 73 57 68" stroke="#2C2013" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
