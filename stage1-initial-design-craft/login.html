<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — NAPLAN Prep Hub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><img src="images/logo.jpg" alt="NAPLAN Prep Hub logo" class="brand-logo"> NAPLAN Prep Hub</a>
    <nav class="main-nav">
      <a href="understand.html" class="nav-link"><i class="ti ti-book-2"></i><span>Understand</span></a>
      <a href="practice.html" class="nav-link"><i class="ti ti-target-arrow"></i><span>Practice</span></a>
      <a href="check-level.html" class="nav-link"><i class="ti ti-gauge"></i><span>Check my level</span></a>
      <span id="auth-slot" class="auth-slot">
        <a href="login.html" class="auth-login-link">Log in</a>
        <a class="btn btn-primary btn-small" href="signup.html">Sign up</a>
      </span>
    </nav>
  </div>
</header>

<section class="page-section container">
  <h1>Log in</h1>
  <p class="lede">Log in to take practice quizzes, save your results, and see your progress over time.</p>

  <form class="auth-form" id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <div class="auth-error" id="error-box"></div>

    <button type="submit" class="btn btn-primary">Log in</button>
  </form>

  <p class="auth-switch">Don't have an account? <a href="signup.html" style="font-weight:600;color:var(--badge-amber-fg);">Sign up</a></p>
</section>

<footer class="site-footer">
  <div class="container">
    <span>NAPLAN Prep Hub · not affiliated with ACARA</span>
    <span>FAQ · Privacy · Contact</span>
  </div>
</footer>

<script src="js/auth-nav.js"></script>
<script src="js/interactions.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get("redirect") || "profile.html";

  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    errorBox.classList.remove("visible");

    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    })
      .then(async (res) => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");
        window.location.href = redirectTo;
      })
      .catch((err) => {
        errorBox.textContent = err.message;
        errorBox.classList.add("visible");
      });
  });
</script>
</body>
</html>
